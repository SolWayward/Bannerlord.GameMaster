  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Captures the full character development state of the specified hero.

    Iterates Skills.All, Attributes.All, and PerkObject.All to record current values.
  example: []
  syntax:
    content: public static HeroSkillSnapshot Capture(Hero hero)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero whose state to capture
    return:
      type: Bannerlord.GameMaster.Heroes.HeroDevelopment.HeroSkillSnapshot
      description: A new snapshot containing the hero's current development state, or null if hero is null
    content.vb: Public Shared Function Capture(hero As Hero) As HeroSkillSnapshot
