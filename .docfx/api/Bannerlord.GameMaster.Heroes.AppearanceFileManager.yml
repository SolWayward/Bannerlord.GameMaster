  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Loads appearance data from a JSON file and applies it to a hero.

    Parses the BodyPropertiesString to extract StaticBodyProperties, Weight, and Build.

    Age is NOT applied (tied to hero birth date/timeline).

    Gender mismatch is blocked by default unless forceGenderMismatch is true.
  example: []
  syntax:
    content: public BLGMResult LoadAppearanceToHero(Hero hero, string filepath, bool forceGenderMismatch = false)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to apply appearance to
    - id: filepath
      type: System.String
      description: The full file path to load from
    - id: forceGenderMismatch
      type: System.Boolean
      description: If true, allows applying appearance across genders
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Function LoadAppearanceToHero(hero As Hero, filepath As String, forceGenderMismatch As Boolean = False) As BLGMResult
