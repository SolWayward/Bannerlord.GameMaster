  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Creates a new hero editor state for the specified hero.

    Parameters must be passed via constructor because the screen is created

    during CreateState() before any Initialize() method could be called.

    The HeroSkillEditor is created immediately, capturing the hero's current

    development state as a snapshot for reset/cancel support.
  example: []
  syntax:
    content: public HeroEditorState(Hero targetHero, Action onCloseCallback)
    parameters:
    - id: targetHero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero whose character development will be edited
    - id: onCloseCallback
      type: System.Action
      description: Optional callback when editor closes
    content.vb: Public Sub New(targetHero As Hero, onCloseCallback As Action)
