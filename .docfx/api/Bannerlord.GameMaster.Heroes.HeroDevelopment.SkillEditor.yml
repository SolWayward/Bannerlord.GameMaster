  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Sets a hero's skill to an exact level by computing and applying the required XP.

    Works for both increasing and decreasing skill levels.

    Uses native SetInitialSkillLevel which directly sets XP and skill value.
  example: []
  syntax:
    content: public static BLGMResult SetSkillLevel(Hero hero, SkillObject skill, int level)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to set
    - id: level
      type: System.Int32
      description: The target skill level (clamped to 0-1023)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function SetSkillLevel(hero As Hero, skill As SkillObject, level As Integer) As BLGMResult
