  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Injects XP directly into a skill. Always positive in native API.

    Bypasses focus factor by passing isAffectedByFocusFactor: false.
  example: []
  syntax:
    content: public static BLGMResult AddSkillXp(Hero hero, SkillObject skill, float xp)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to add XP to
    - id: xp
      type: System.Single
      description: The amount of XP to add (must be positive)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function AddSkillXp(hero As Hero, skill As SkillObject, xp As Single) As BLGMResult
