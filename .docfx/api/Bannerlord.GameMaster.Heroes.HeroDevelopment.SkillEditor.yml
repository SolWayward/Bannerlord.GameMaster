  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Changes a hero's skill level by a delta amount (positive or negative).

    For positive deltas, uses native ChangeSkillLevel which adds XP.

    For negative deltas, uses SetInitialSkillLevel since native AddSkillXp rejects negative XP.
  example: []
  syntax:
    content: public static BLGMResult ChangeSkillLevel(Hero hero, SkillObject skill, int delta)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to change
    - id: delta
      type: System.Int32
      description: The amount to change (positive to increase, negative to decrease)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function ChangeSkillLevel(hero As Hero, skill As SkillObject, delta As Integer) As BLGMResult
  overload: Bannerlord.GameMaster.Heroes.HeroDevelopment.SkillEditor.ChangeSkillLevel*
  nameWithType.vb: SkillEditor.ChangeSkillLevel(Hero, SkillObject, Integer)
