  summary: >-
    Returns information about a hero's skill including current level, total XP,

    XP progress toward next level, and XP required for next level.
  example: []
  syntax:
    content: public static SkillInfo GetSkillInfo(Hero hero, SkillObject skill)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to query
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to get info for
    return:
      type: Bannerlord.GameMaster.Heroes.HeroDevelopment.SkillInfo
      description: A SkillInfo struct with skill details, or default if parameters are null
