  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Adds or removes focus points by a delta amount.

    Positive delta increases, negative delta decreases.

    Bypasses unspent focus point cost.
  example: []
  syntax:
    content: public static BLGMResult AddFocus(Hero hero, SkillObject skill, int delta)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to change focus for
    - id: delta
      type: System.Int32
      description: The amount to change (positive to add, negative to remove)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function AddFocus(hero As Hero, skill As SkillObject, delta As Integer) As BLGMResult
  overload: Bannerlord.GameMaster.Heroes.HeroDevelopment.FocusEditor.AddFocus*
