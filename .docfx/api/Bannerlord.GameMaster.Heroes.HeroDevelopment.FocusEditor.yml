  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Sets a hero's focus for a skill to an exact value. Computes the delta from current

    and calls AddFocus or RemoveFocus accordingly.

    Bypasses unspent focus point restrictions by passing checkUnspentFocusPoints: false.
  example: []
  syntax:
    content: public static BLGMResult SetFocus(Hero hero, SkillObject skill, int value)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: skill
      type: TaleWorlds.Core.SkillObject
      description: The skill to set focus for
    - id: value
      type: System.Int32
      description: The target focus value (clamped to 0-MaxFocusPerSkill)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function SetFocus(hero As Hero, skill As SkillObject, value As Integer) As BLGMResult
  overload: Bannerlord.GameMaster.Heroes.HeroDevelopment.FocusEditor.SetFocus*
  nameWithType.vb: FocusEditor.SetFocus(Hero, SkillObject, Integer)
