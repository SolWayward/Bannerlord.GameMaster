  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Creates a new army led by the specified party's leader.<br />

    The army is created using the native <xref href="TaleWorlds.CampaignSystem.Army.%23ctor(TaleWorlds.CampaignSystem.Kingdom%2cTaleWorlds.CampaignSystem.Party.MobileParty%2cTaleWorlds.CampaignSystem.Army.ArmyTypes)" data-throw-if-not-resolved="false"></xref> 

    constructor which registers the army with the kingdom, sets up periodic tick events,

    and assigns the leader party. Member parties are added via the native

    <xref href="TaleWorlds.CampaignSystem.Party.MobileParty.Army" data-throw-if-not-resolved="false"></xref> setter which fires <code>OnPartyJoinedArmy</code> events

    and handles influence costs for AI parties.<br /><br />

    After all members are added, <xref href="TaleWorlds.CampaignSystem.Actions.GatherArmyAction.Apply(TaleWorlds.CampaignSystem.Party.MobileParty%2cTaleWorlds.CampaignSystem.Map.IMapPoint)" data-throw-if-not-resolved="false"></xref> is called to

    fire the <code>OnArmyGathered</code> campaign event. If <code class="paramref">teleportMembers</code>

    is true, all member parties are teleported to the commander and physically attached.
  example: []
  syntax:
    content: public static Army CreateArmy(MobileParty leaderParty, List<MobileParty> memberParties = null, Army.ArmyTypes armyType = ArmyTypes.Patrolling, bool teleportMembers = true)
    parameters:
    - id: leaderParty
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The party that will lead the army (required, must have a leader hero in a kingdom)
    - id: memberParties
      type: System.Collections.Generic.List{TaleWorlds.CampaignSystem.Party.MobileParty}
      description: Optional list of parties to add as army members
    - id: armyType
      type: TaleWorlds.CampaignSystem.Army.ArmyTypes
      description: 'The type of army to create (default: Patrolling)'
    - id: teleportMembers
      type: System.Boolean
      description: 'If true, teleports all member parties to the commander and attaches them (default: true)'
    return:
      type: TaleWorlds.CampaignSystem.Army
      description: The created <xref href="TaleWorlds.CampaignSystem.Army" data-throw-if-not-resolved="false"></xref>, or null if validation fails
    content.vb: Public Shared Function CreateArmy(leaderParty As MobileParty, memberParties As List(Of MobileParty) = Nothing, armyType As Army.ArmyTypes = ArmyTypes.Patrolling, teleportMembers As Boolean = True) As Army
  overload: Bannerlord.GameMaster.Armies.ArmyManager.CreateArmy*
  nameWithType.vb: ArmyManager.CreateArmy(MobileParty, List(Of MobileParty), Army.ArmyTypes, Boolean)
  fullName.vb: Bannerlord.GameMaster.Armies.ArmyManager.CreateArmy(TaleWorlds.CampaignSystem.Party.MobileParty, System.Collections.Generic.List(Of TaleWorlds.CampaignSystem.Party.MobileParty), TaleWorlds.CampaignSystem.Army.ArmyTypes, Boolean)
  name.vb: CreateArmy(MobileParty, List(Of MobileParty), ArmyTypes, Boolean)
