  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Changes the commander (leader party) of an existing army without disbanding it.<br /><br />

    The new leader must already be a member of the army. This method uses reflection to set

    <xref href="TaleWorlds.CampaignSystem.Army.LeaderParty" data-throw-if-not-resolved="false"></xref> (private setter) and then re-attaches all member parties

    to the new leader. The old leader becomes a regular attached member.<br /><br />

    <b>Why reflection:</b> <code>Army.LeaderParty</code> has a private setter and is only assigned

    in the <xref href="TaleWorlds.CampaignSystem.Army" data-throw-if-not-resolved="false"></xref> constructor. No public API exists to change the leader without

    disbanding and recreating the army, which fires <code>OnArmyDispersed</code> events and has

    undesirable side effects.<br /><br />

    <b>Execution sequence</b> (order prevents disband cascade):<br />

    1. Detach all parties from old leader (sets <code>AttachedTo = null</code>)<br />

    2. Swap <code>LeaderParty</code> via reflection<br />

    3. Set <code>ArmyOwner</code> to new leader's hero<br />

    4. Call <code>UpdateName()</code> to regenerate army name<br />

    5. Re-attach all member parties to the new leader via <xref href="TaleWorlds.CampaignSystem.Army.AddPartyToMergedParties(TaleWorlds.CampaignSystem.Party.MobileParty)" data-throw-if-not-resolved="false"></xref>
  example: []
  syntax:
    content: public static BLGMResult SetCommander(Army army, MobileParty newLeaderParty)
    parameters:
    - id: army
      type: TaleWorlds.CampaignSystem.Army
      description: The army to change the commander of
    - id: newLeaderParty
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The party that will become the new leader (must already be in the army)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure with reason
    content.vb: Public Shared Function SetCommander(army As Army, newLeaderParty As MobileParty) As BLGMResult
  overload: Bannerlord.GameMaster.Armies.ArmyManager.SetCommander*
