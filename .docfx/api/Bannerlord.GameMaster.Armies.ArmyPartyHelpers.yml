    id: TryAddPartyToArmy
    path: ../Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
    startLine: 26
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Validates and adds a party to an existing army using the native

    <xref href="TaleWorlds.CampaignSystem.Party.MobileParty.Army" data-throw-if-not-resolved="false"></xref> setter which triggers <code>OnAddPartyInternal</code>,

    adding the party to the army's party list and firing <code>OnPartyJoinedArmy</code>.<br /><br />

    Filters out parties that are null, already in an army, disbanded, the leader party itself,

    or lacking a leader hero.
  example: []
  syntax:
    content: public static BLGMResult TryAddPartyToArmy(Army army, MobileParty party)
    parameters:
    - id: army
      type: TaleWorlds.CampaignSystem.Army
      description: The army to add the party to
    - id: party
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The party to add
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure with reason
    content.vb: Public Shared Function TryAddPartyToArmy(army As Army, party As MobileParty) As BLGMResult
  overload: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryAddPartyToArmy*
- uid: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryRemovePartyFromArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
  commentId: M:Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryRemovePartyFromArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
  id: TryRemovePartyFromArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
  parent: Bannerlord.GameMaster.Armies.ArmyPartyHelpers
  langs:
  - csharp
  - vb
  name: TryRemovePartyFromArmy(Army, MobileParty)
  nameWithType: ArmyPartyHelpers.TryRemovePartyFromArmy(Army, MobileParty)
  fullName: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryRemovePartyFromArmy(TaleWorlds.CampaignSystem.Army, TaleWorlds.CampaignSystem.Party.MobileParty)
  type: Method
  source:
    remote:
      path: Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
      branch: master
      repo: https://github.com/SolWayward/Bannerlord.GameMaster
    id: TryRemovePartyFromArmy
    path: ../Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
    startLine: 85
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Validates and removes a party from an army using the native

    <xref href="TaleWorlds.CampaignSystem.Party.MobileParty.Army" data-throw-if-not-resolved="false"></xref> setter (set to null) which triggers <code>OnRemovePartyInternal</code>,

    removing the party from the army's party list, firing <code>OnPartyRemovedFromArmy</code>,

    and setting <code>AttachedTo = null</code>.<br /><br />

    Cannot remove the leader party -- use <xref href="Bannerlord.GameMaster.Armies.ArmyManager.SetCommander(TaleWorlds.CampaignSystem.Army%2cTaleWorlds.CampaignSystem.Party.MobileParty)" data-throw-if-not-resolved="false"></xref> first to swap

    the leader, or disband the army entirely. Removing the leader via this path would trigger

    <code>DisbandArmyAction.ApplyByLeaderPartyRemoved</code> which disbands the entire army.
  example: []
  syntax:
    content: public static BLGMResult TryRemovePartyFromArmy(Army army, MobileParty party)
    parameters:
    - id: army
      type: TaleWorlds.CampaignSystem.Army
      description: The army to remove the party from
    - id: party
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The party to remove
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure with reason
    content.vb: Public Shared Function TryRemovePartyFromArmy(army As Army, party As MobileParty) As BLGMResult
  overload: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryRemovePartyFromArmy*
- uid: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartiesToCommander(TaleWorlds.CampaignSystem.Army)
