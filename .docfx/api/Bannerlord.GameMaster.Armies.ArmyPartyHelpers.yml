    id: TeleportPartiesToCommander
    path: ../Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
    startLine: 131
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Teleports all army member parties to the commander's position and physically

    attaches them using the native <xref href="TaleWorlds.CampaignSystem.Army.AddPartyToMergedParties(TaleWorlds.CampaignSystem.Party.MobileParty)" data-throw-if-not-resolved="false"></xref>.<br /><br />

    Each party is first safely extracted from any settlement or existing attachment

    via <xref href="Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartyToPosition(TaleWorlds.CampaignSystem.Party.MobileParty%2cTaleWorlds.Library.Vec2)" data-throw-if-not-resolved="false"></xref>, then attached to the leader.

    Skips the leader party itself and any parties already attached.
  example: []
  syntax:
    content: public static BLGMResult TeleportPartiesToCommander(Army army)
    parameters:
    - id: army
      type: TaleWorlds.CampaignSystem.Army
      description: The army whose members to teleport
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success with count of teleported parties
    content.vb: Public Shared Function TeleportPartiesToCommander(army As Army) As BLGMResult
  overload: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartiesToCommander*
- uid: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartyToPosition(TaleWorlds.CampaignSystem.Party.MobileParty,TaleWorlds.Library.Vec2)
  commentId: M:Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartyToPosition(TaleWorlds.CampaignSystem.Party.MobileParty,TaleWorlds.Library.Vec2)
  id: TeleportPartyToPosition(TaleWorlds.CampaignSystem.Party.MobileParty,TaleWorlds.Library.Vec2)
  parent: Bannerlord.GameMaster.Armies.ArmyPartyHelpers
  langs:
  - csharp
  - vb
  name: TeleportPartyToPosition(MobileParty, Vec2)
  nameWithType: ArmyPartyHelpers.TeleportPartyToPosition(MobileParty, Vec2)
  fullName: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartyToPosition(TaleWorlds.CampaignSystem.Party.MobileParty, TaleWorlds.Library.Vec2)
  type: Method
  source:
    remote:
      path: Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
      branch: master
      repo: https://github.com/SolWayward/Bannerlord.GameMaster
    id: TeleportPartyToPosition
    path: ../Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
    startLine: 186
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Armies
  summary: >-
    Safely teleports a single party to a target map position.<br /><br />

    Handles the following edge cases before moving:<br />

    - Leaves the current settlement via <xref href="TaleWorlds.CampaignSystem.Actions.LeaveSettlementAction.ApplyForParty(TaleWorlds.CampaignSystem.Party.MobileParty)" data-throw-if-not-resolved="false"></xref> if inside one<br />

    - Detaches from any party it is currently attached to<br />

    - Sets position and puts the party in hold mode to prevent immediate AI repath
  example: []
  syntax:
    content: public static BLGMResult TeleportPartyToPosition(MobileParty party, Vec2 targetPosition)
    parameters:
    - id: party
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The party to teleport
    - id: targetPosition
      type: TaleWorlds.Library.Vec2
      description: The 2D map position to teleport to
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function TeleportPartyToPosition(party As MobileParty, targetPosition As Vec2) As BLGMResult
  overload: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TeleportPartyToPosition*
