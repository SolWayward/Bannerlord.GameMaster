  nameWithType: ArmyPartyHelpers.TryAddPartyToArmy(Army, MobileParty)
  fullName: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryAddPartyToArmy(TaleWorlds.CampaignSystem.Army, TaleWorlds.CampaignSystem.Party.MobileParty)
  type: Method
  source:
    remote:
      path: Bannerlord.GameMaster/Armies/ArmyPartyHelpers.cs
      branch: master
