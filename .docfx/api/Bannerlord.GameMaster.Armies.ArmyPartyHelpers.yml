- uid: Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryAddPartyToArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
  commentId: M:Bannerlord.GameMaster.Armies.ArmyPartyHelpers.TryAddPartyToArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
  id: TryAddPartyToArmy(TaleWorlds.CampaignSystem.Army,TaleWorlds.CampaignSystem.Party.MobileParty)
