  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Party
  summary: >-
    Opens the party screen with the right side showing a real party and the left side

    populated with all game troops (100 of each), similar to the native cheat mode pattern.

    The left side acts as a discard/source roster for adding troops to the party.

    <br /><br />

    Heroes removed from the right party (discarded) are set to Fugitive state via

    MakeHeroFugitiveAction so the game's TeleportationCampaignBehavior can re-place them

    at a nearby settlement. Blocks the player character and party leader from transfer.
  example: []
  syntax:
    content: public static BLGMResult OpenWithDiscardRoster(MobileParty rightParty, Action onComplete = null)
    parameters:
    - id: rightParty
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: Party shown on the right side
    - id: onComplete
      type: System.Action
      description: Optional callback when party screen closes
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function OpenWithDiscardRoster(rightParty As MobileParty, onComplete As Action = Nothing) As BLGMResult
  overload: Bannerlord.GameMaster.Party.PartyUILauncher.OpenWithDiscardRoster*
