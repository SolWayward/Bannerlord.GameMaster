  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Sets a hero's attribute to an exact value. Computes the delta from current

    and calls AddAttribute or RemoveAttribute accordingly.

    Bypasses unspent point restrictions by passing checkUnspentPoints: false.
  example: []
  syntax:
    content: public static BLGMResult SetAttribute(Hero hero, CharacterAttribute attribute, int value, bool respectMaxCap = true)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: attribute
      type: TaleWorlds.Core.CharacterAttribute
      description: The attribute to set
    - id: value
      type: System.Int32
      description: The target attribute value (clamped to 0-MaxAttribute by native)
    - id: respectMaxCap
      type: System.Boolean
      description: If true, respects the native MaxAttribute cap. If false, bypasses it.
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function SetAttribute(hero As Hero, attribute As CharacterAttribute, value As Integer, respectMaxCap As Boolean = True) As BLGMResult
