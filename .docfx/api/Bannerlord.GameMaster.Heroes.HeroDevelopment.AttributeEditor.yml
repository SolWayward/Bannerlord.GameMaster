  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Adds or removes attribute points by a delta amount.

    Positive delta increases, negative delta decreases.

    Bypasses unspent point restrictions.
  example: []
  syntax:
    content: public static BLGMResult AddAttribute(Hero hero, CharacterAttribute attribute, int delta)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: attribute
      type: TaleWorlds.Core.CharacterAttribute
      description: The attribute to change
    - id: delta
      type: System.Int32
      description: The amount to change (positive to add, negative to remove)
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function AddAttribute(hero As Hero, attribute As CharacterAttribute, delta As Integer) As BLGMResult
