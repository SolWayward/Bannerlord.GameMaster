    id: ImportCharacterSet
    path: ../Bannerlord.GameMaster/Heroes/CharacterSetFileManager.cs
    startLine: 288
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Creates a brand new hero from saved character data.

    Uses HeroGenerator to create and initialize the hero, then overrides with saved data.
  example: []
  syntax:
    content: public BLGMResult ImportCharacterSet(string filepath, Clan clan, string typeOverride = null, Settlement settlement = null, bool withParty = true)
    parameters:
    - id: filepath
      type: System.String
      description: Full path to the character set JSON file
    - id: clan
      type: TaleWorlds.CampaignSystem.Clan
      description: Target clan for the new hero (required)
    - id: typeOverride
      type: System.String
      description: 'Override hero type from file. If null, uses saved HeroType. Valid: "lord", "wanderer", "companion"'
    - id: settlement
      type: TaleWorlds.CampaignSystem.Settlements.Settlement
      description: Settlement for placement. If null, auto-resolved from clan
    - id: withParty
      type: System.Boolean
      description: 'For Lords only: create a party. Defaults to true'
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult with the created hero summary
    content.vb: Public Function ImportCharacterSet(filepath As String, clan As Clan, typeOverride As String = Nothing, settlement As Settlement = Nothing, withParty As Boolean = True) As BLGMResult
