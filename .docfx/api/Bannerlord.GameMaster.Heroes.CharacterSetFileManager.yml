  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Creates a new hero and applies data from a single individual set file (Appearance, Development, Traits, or Equipment).

    Unlike ImportCharacterSet() which requires a full CharacterSetData, this works with partial set files.

    Missing metadata (gender, culture, age, level) is resolved from defaults or the clan.

    The hero is fully initialized with generated skills/traits/equipment, then the individual set overrides its section.
  example: []
  syntax:
    content: public BLGMResult ImportFromIndividualSet(string filepath, IndividualSetType setType, Clan clan, string heroType = "lord", Settlement settlement = null, bool withParty = true)
    parameters:
    - id: filepath
      type: System.String
      description: Full path to the individual set JSON file.
    - id: setType
      type: Bannerlord.GameMaster.Heroes.IndividualSetType
      description: Which type of individual set file this is.
    - id: clan
      type: TaleWorlds.CampaignSystem.Clan
      description: Target clan for the new hero (required).
    - id: heroType
      type: System.String
      description: 'Override hero type: "lord", "wanderer", "companion". Defaults to "lord".'
    - id: settlement
      type: TaleWorlds.CampaignSystem.Settlements.Settlement
      description: Settlement for placement. If null, auto-resolved from clan.
    - id: withParty
      type: System.Boolean
      description: 'For Lords only: create a party. Defaults to true.'
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult with the created hero summary.
    content.vb: Public Function ImportFromIndividualSet(filepath As String, setType As IndividualSetType, clan As Clan, heroType As String = "lord", settlement As Settlement = Nothing, withParty As Boolean = True) As BLGMResult
