  fullName.vb: Bannerlord.GameMaster.Heroes.HeroGenerator.RegenerateSkillsForLevel(TaleWorlds.CampaignSystem.Hero, Integer, Boolean)
  name.vb: RegenerateSkillsForLevel(Hero, Integer, Boolean)
