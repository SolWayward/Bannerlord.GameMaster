  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Layer 2: Initializes a hero as a Lord with proper occupation, equipment, and optionally creates a party.

    Hero must have a clan assigned before calling this method.
  example: []
  syntax:
    content: public static void InitializeAsLord(Hero hero, Settlement homeSettlement, bool createParty = true, int targetLevel = -1, bool isCombatFocused = true)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: Hero to initialize as Lord. Must have a clan assigned.
    - id: homeSettlement
      type: TaleWorlds.CampaignSystem.Settlements.Settlement
      description: Settlement for hero's home (used for party spawn if creating party).
    - id: createParty
      type: System.Boolean
      description: Optional. If true, creates a party for the lord if clan is below commander limit. Defaults to true.
    - id: targetLevel
      type: System.Int32
      description: Optional. Target level for the hero (uncapped). If less than 1 (default -1), a random level between 10 and 25 (inclusive) is assigned.
    - id: isCombatFocused
      type: System.Boolean
      description: Optional. If true (default), primary skills are combat-oriented. If false, primary skills are management/utility-oriented.
