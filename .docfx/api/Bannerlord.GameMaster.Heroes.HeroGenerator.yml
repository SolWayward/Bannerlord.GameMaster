  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Public entry point to regenerate a hero's skills, attributes, focus, and perks for a target level.

    Clears existing character development state and rebuilds from scratch using the skill distribution algorithm.

    Useful for reviving dead heroes whose OnDeath() cleared their skills/perks/traits.

    If targetLevel is less than 1, uses the hero's current Level value as the target.
  example: []
  syntax:
    content: public static void RegenerateSkillsForLevel(Hero hero, int targetLevel = -1, bool isCombatFocused = true)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero whose skills will be regenerated. HeroDeveloper must not be null.
    - id: targetLevel
      type: System.Int32
      description: Target level. If less than 1, defaults to hero.Level (minimum 1).
    - id: isCombatFocused
      type: System.Boolean
      description: If true, combat skills are primary. If false, noncombat skills are primary.
    content.vb: Public Shared Sub RegenerateSkillsForLevel(hero As Hero, targetLevel As Integer = -1, isCombatFocused As Boolean = True)
  overload: Bannerlord.GameMaster.Heroes.HeroGenerator.RegenerateSkillsForLevel*
