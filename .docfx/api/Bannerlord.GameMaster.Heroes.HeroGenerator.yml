  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Creates a lord with the specified name and culture, optionally with a party.

    This is a high-level Layer 3 convenience method that combines creation (Layer 1) and initialization (Layer 2).

    Random level range for lords: 10-25.
  example: []
  syntax:
    content: public static Hero CreateLord(string name, CultureFlags cultureFlags, GenderFlags genderFlags, Clan clan, bool withParty = true, Settlement settlement = null, float randomFactor = 0.5, int targetLevel = -1, int age = -1, bool isCombatFocused = true)
    parameters:
    - id: name
      type: System.String
      description: Name for the lord.
    - id: cultureFlags
      type: Bannerlord.GameMaster.Cultures.CultureFlags
      description: Culture pool to select character template from.
    - id: genderFlags
      type: Bannerlord.GameMaster.Characters.GenderFlags
      description: Gender selection for character template.
    - id: clan
      type: TaleWorlds.CampaignSystem.Clan
      description: Clan for the lord (required).
    - id: withParty
      type: System.Boolean
      description: Optional. If true, creates a party for the lord if clan is below commander limit. Defaults to true.
    - id: settlement
      type: TaleWorlds.CampaignSystem.Settlements.Settlement
      description: Optional. Home settlement for the lord. Defaults to null (auto-resolved).
    - id: randomFactor
      type: System.Single
      description: Optional. Appearance randomization factor (0-1). Defaults to 0.5.
    - id: targetLevel
      type: System.Int32
      description: Optional. Target level for the hero (uncapped). If less than 1 (default -1), a random level between 10 and 25 (inclusive) is assigned.
    - id: age
      type: System.Int32
      description: >-
        Optional. Hero's age. Minimum age is 18. If not specified (default -1), or if value is less than 18,
            a random age between 18 and 30 (inclusive) is assigned.
    - id: isCombatFocused
      type: System.Boolean
      description: Optional. If true (default), primary skills are combat-oriented. If false, primary skills are management/utility-oriented.
    return:
      type: TaleWorlds.CampaignSystem.Hero
      description: Created and initialized lord hero.
    content.vb: Public Shared Function CreateLord(name As String, cultureFlags As CultureFlags, genderFlags As GenderFlags, clan As Clan, withParty As Boolean = True, settlement As Settlement = Nothing, randomFactor As Single = 0.5, targetLevel As Integer = -1, age As Integer = -1, isCombatFocused As Boolean = True) As Hero
