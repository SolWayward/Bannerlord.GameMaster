  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Deselects (deactivates) a perk for a hero.

    Uses reflection to call Hero.SetPerkValueInternal(perk, false) since it is internal.

    Also handles permanent bonus reversal for perks that grant permanent attribute/focus bonuses.
  example: []
  syntax:
    content: public static BLGMResult DeselectPerk(Hero hero, PerkObject perk)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to modify
    - id: perk
      type: TaleWorlds.CampaignSystem.CharacterDevelopment.PerkObject
      description: The perk to deselect
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function DeselectPerk(hero As Hero, perk As PerkObject) As BLGMResult
