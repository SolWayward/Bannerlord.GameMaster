    id: DetectEntityAtWorldPosition
    path: ../Bannerlord.GameMaster/Map/MapEntityDetector.cs
    startLine: 31
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Map
  summary: >-
    Detects the nearest map entity (party or settlement) at the given world position.

    Parties are prioritized over settlements when both overlap, matching the game's

    native behavior of prioritizing mobile entities over static ones.

    Returns a terrain result if no entity is within detection range.
  example: []
  syntax:
    content: public static MapEntityDetectionResult DetectEntityAtWorldPosition(Vec2 worldPosition, float partyRadiusSq = 1, float settlementRadiusSq = 4)
    parameters:
    - id: worldPosition
      type: TaleWorlds.Library.Vec2
      description: The campaign map world position to detect entities at
    - id: partyRadiusSq
      type: System.Single
      description: 'Squared detection radius for parties (default: 1.0)'
    - id: settlementRadiusSq
      type: System.Single
      description: 'Squared detection radius for settlements (default: 4.0)'
    return:
      type: Bannerlord.GameMaster.Map.MapEntityDetectionResult
      description: Detection result containing the entity type and reference
    content.vb: Public Shared Function DetectEntityAtWorldPosition(worldPosition As Vec2, partyRadiusSq As Single = 1, settlementRadiusSq As Single = 4) As MapEntityDetectionResult
