    path: ../Bannerlord.GameMaster/Map/MapEntityDetector.cs
    startLine: 63
  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Map
  summary: >-
    Finds the nearest visible mobile party to a world position within the detection radius.

    Skips invisible, removed, and settlement-docked parties.

    Uses DistanceSquared for performance (no sqrt).
  example: []
  syntax:
    content: public static MobileParty FindNearestParty(Vec2 worldPosition, float detectionRadiusSq = 1, Func<MobileParty, bool> predicate = null)
    parameters:
    - id: worldPosition
      type: TaleWorlds.Library.Vec2
      description: The campaign map world position to search from
    - id: detectionRadiusSq
      type: System.Single
      description: 'Squared maximum detection distance (default: 1.0)'
    - id: predicate
      type: System.Func{TaleWorlds.CampaignSystem.Party.MobileParty,System.Boolean}
      description: Optional filter predicate to exclude specific parties
    return:
      type: TaleWorlds.CampaignSystem.Party.MobileParty
      description: The nearest matching party, or null if none found within radius
    content.vb: Public Shared Function FindNearestParty(worldPosition As Vec2, detectionRadiusSq As Single = 1, predicate As Func(Of MobileParty, Boolean) = Nothing) As MobileParty
