  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes.HeroDevelopment
  summary: >-
    Loads development data from a JSON file and applies it to a hero.

    Follows the HeroSkillSnapshot.RestoreTo pattern:

    1. Set Attributes, 2. Set Focus, 3. Set Skill Levels,

    4. Clear All Perks, 5. Re-Select Saved Perks, 6. Set Unspent Points,

    7. RecalculateLevel.
  example: []
  syntax:
    content: public BLGMResult LoadDevelopmentToHero(Hero hero, string filepath)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to apply development to
    - id: filepath
      type: System.String
      description: The full file path to load from
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult with details including skipped items
    content.vb: Public Function LoadDevelopmentToHero(hero As Hero, filepath As String) As BLGMResult
  overload: Bannerlord.GameMaster.Heroes.HeroDevelopment.DevelopmentFileManager.LoadDevelopmentToHero*
