  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Heroes
  summary: >-
    Loads trait data from a JSON file and applies it to a hero.

    For each trait, resolves by StringId and calls hero.SetTraitLevel().

    Tracks skipped traits (removed mod traits) in the result.
  example: []
  syntax:
    content: public BLGMResult LoadTraitsToHero(Hero hero, string filepath)
    parameters:
    - id: hero
      type: TaleWorlds.CampaignSystem.Hero
      description: The hero to apply traits to
    - id: filepath
      type: System.String
      description: The full file path to load from
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult with loaded/skipped counts
    content.vb: Public Function LoadTraitsToHero(hero As Hero, filepath As String) As BLGMResult
