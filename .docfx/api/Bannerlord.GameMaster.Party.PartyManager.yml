  assemblies:
  - Bannerlord.GameMaster
  namespace: Bannerlord.GameMaster.Party
  summary: >-
    Opens the party editor with two heroes' parties side by side.

    If leftSideHero is null, same party as rightSideHero, or has no party,

    falls back to discard mode with all game troops on the left.
  example: []
  syntax:
    content: public static BLGMResult OpenPartyEditor(Hero rightSideHero, Hero leftSideHero, Action onComplete = null)
    parameters:
    - id: rightSideHero
      type: TaleWorlds.CampaignSystem.Hero
      description: Hero whose party appears on the right side (required)
    - id: leftSideHero
      type: TaleWorlds.CampaignSystem.Hero
      description: Hero whose party appears on the left side (null for discard mode)
    - id: onComplete
      type: System.Action
      description: Optional callback when party screen closes
    return:
      type: Bannerlord.GameMaster.Common.BLGMResult
      description: BLGMResult indicating success or failure
    content.vb: Public Shared Function OpenPartyEditor(rightSideHero As Hero, leftSideHero As Hero, onComplete As Action = Nothing) As BLGMResult
  overload: Bannerlord.GameMaster.Party.PartyManager.OpenPartyEditor*
